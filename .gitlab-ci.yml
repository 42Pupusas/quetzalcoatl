stages:
  - probe
  - verify
  - campaign

variables:
  CARGO_TERM_COLOR: never
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  RUST_BACKTRACE: "1"

default:
  tags:
    - ansible
  cache:
    key:
      files:
        - Cargo.toml
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target

# The park campaign's whole claim is "another host, another
# scheduler". A result without the core count and kernel is not a
# second data point, it is an anecdote — so every job records both
# before it does anything else.
.on_host:
  before_script:
    - uname -a
    - nproc
    - cargo --version
    - rustc --version

host:
  stage: probe
  extends: .on_host
  script:
    - echo "toolchain and core count recorded above"

test:
  stage: verify
  extends: .on_host
  script:
    - cargo test
    - cargo test --features async
    - cargo test --all-features
    - cargo clippy --all-targets -- -D warnings
    - cargo clippy --all-targets --all-features -- -D warnings

# The open audit item. Every blocking park in the crate is untimed, so
# a lost wake is a hang: this job either completes or it stalls, and
# both are results. Manual because it is ~200s per 2000 iterations and
# because a stall should be read, not retried.
park-campaign:
  stage: campaign
  extends: .on_host
  when: manual
  timeout: 2h
  variables:
    QUETZALCOATL_STRESS_ITERS: "2000"
  script:
    - cargo test --release --features backstop-metrics -- --ignored --nocapture block_stress_diagnostic 2>&1 | tee campaign.log
  artifacts:
    when: always
    paths:
      - campaign.log
    expire_in: 1 month

stress:
  stage: campaign
  extends: .on_host
  when: manual
  timeout: 3h
  script:
    - cargo test --release --features async -- --ignored 2>&1 | tee stress-async.log
    - cargo test --release --all-features -- --ignored 2>&1 | tee stress-all.log
  artifacts:
    when: always
    paths:
      - stress-async.log
      - stress-all.log
    expire_in: 1 month

bench:
  stage: campaign
  extends: .on_host
  when: manual
  timeout: 2h
  script:
    - cargo bench 2>&1 | tee bench.log
  artifacts:
    when: always
    paths:
      - bench.log
    expire_in: 1 month
