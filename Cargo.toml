[package]
name = "quetzalcoatl"
version = "0.16.0"
edition = "2021"
# Raised from 1.88 deliberately: 1.100 stabilizes the `Allocator` trait
# and `Vec::with_capacity_in`, which `AlignedBuf` is built on, and
# Cargo's `min-publish-age` dependency cooldown (.cargo/config.toml).
#
# The floor is checked by the `msrv` CI job, not assumed:
# `Duration::from_mins` (1.91) once reached a published crate because
# every build that saw it was newer than the declared version.
rust-version = "1.100"
authors = ["quetzalcoatl contributors"]
description = "Lock-free ring buffers (SPSC, MPSC, SPMC, MPMC, and broadcast) for high-performance concurrent communication"
license = "MIT"
repository = "https://github.com/42Pupusas/quetzalcoatl"
keywords = ["lock-free", "mpmc", "spmc", "ring-buffer", "broadcast"]
categories = ["concurrency", "data-structures"]
readme = "README.md"
# Allowlist — keeps benches/ and examples/ out of the published crate
# (they reference dev-dependencies and bloat the download).
#
# Every source directory is matched by glob. Listing `src/common`
# file-by-file is what shipped 0.14.0 broken: nine modules declared in
# `common/mod.rs` were missing from the tarball, so the published crate
# did not compile at all.
#
# Test code is subtracted at the end of the list: rustc does not look
# for the file of a cfg'd-out `mod`, so the published crate builds
# without it. Unit tests live in a `tests.rs` next to the code they
# test, which one glob covers. A module that is test-only as a whole
# (`#[cfg(test)] mod x;`) must be added to the named list.
#
# `cargo package` is the check that catches this: it builds the tarball
# it produces. Run it before publishing.
include = [
    "src/*.rs",
    "src/broadcast/**/*.rs",
    "src/common/**/*.rs",
    "src/mpmc/**/*.rs",
    "src/mpsc/**/*.rs",
    "src/spmc/**/*.rs",
    "src/spsc/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "!src/**/tests.rs",
    "!src/broadcast/replay.rs",
    "!src/common/drop_counter.rs",
    "!src/common/loom_models.rs",
    "!src/common/park_handshake_model.rs",
    "!src/common/park_probe.rs",
    "!src/common/park_replay/**",
    "!src/common/probe_budget.rs",
    "!src/common/progress_watchdog.rs",
    "!src/common/staged_handoff.rs",
    "!src/common/stress_iters.rs",
    "!src/mpmc/replay.rs",
    "!src/mpmc/ring_snapshot.rs",
    "!src/mpsc/replay.rs",
    "!src/spsc/pinned_ring.rs",
]

[features]
# Enables `dhat` heap profiling in examples that opt in (currently
# `mpmc_vs_nspmc_dhat`). Run with:
#   cargo run --release --example mpmc_vs_nspmc_dhat --features dhat-heap
# Output is `dhat-heap.json`, loadable in https://nnethercote.github.io/dh_view/dh_view.html
# The library never uses `dhat`; it is a dev-dependency, and this
# feature only switches the example's global allocator.
async = []
dhat-heap = []
# Counts mpmc parks that returned with their handle still armed — so
# nobody woke them — and how many of those found work immediately
# after: the signature of a wake that went missing.
#
# The 1 ms PARK_BACKSTOP these were built to evaluate is gone and every
# blocking park is now untimed, so such a return means a spurious
# unpark. The counters stay because they are the only instrument that
# sees a lost wake short of a hang; the ignored stress harness prints
# them. See src/mpmc/backstop_monitor.rs for how to read them.
#
# Diagnostic only, off by default: the ring carries no counters and the
# call sites compile to nothing.
backstop-metrics = []

[lints.rust]
# `loom` is a compiler cfg cargo sets from the [target.'cfg(loom)']
# dependency below, not a feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
divan = "0.1"
crossbeam-channel = "0.5"
dhat = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[[bench]]
name = "mpsc"
harness = false

[[bench]]
name = "spsc"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "fanin"
harness = false

[[bench]]
name = "spmc"
harness = false

[[bench]]
name = "mpmc"
harness = false

[[bench]]
name = "matched"
harness = false

[[bench]]
name = "claim_refill"
harness = false

[[bench]]
name = "park"
harness = false

[dev-dependencies]
anyhow = "1.0.102"
io-uring = "0.7.12"
libc = "0.2.186"
