[package]
name = "quetzalcoatl"
version = "0.7.0"
edition = "2021"
authors = ["quetzalcoatl contributors"]
description = "Lock-free ring buffers (SPSC, MPSC, SPMC, and broadcast) for high-performance concurrent communication"
license = "MIT"
repository = "https://github.com/42Pupusas/quetzalcoatl"
keywords = ["lock-free", "mpsc", "spmc", "ring-buffer", "broadcast"]
categories = ["concurrency", "data-structures"]
readme = "README.md"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[[bench]]
name = "mpsc"
harness = false

[[bench]]
name = "spsc"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "fanin"
harness = false

[[bench]]
name = "spmc"
harness = false
