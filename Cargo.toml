[package]
name = "quetzalcoatl"
version = "0.7.1"
edition = "2021"
authors = ["quetzalcoatl contributors"]
description = "Lock-free ring buffers (SPSC, MPSC, SPMC, and broadcast) for high-performance concurrent communication"
license = "MIT"
repository = "https://github.com/42Pupusas/quetzalcoatl"
keywords = ["lock-free", "mpsc", "spmc", "ring-buffer", "broadcast"]
categories = ["concurrency", "data-structures"]
readme = "README.md"

[features]
# Internal: counts FAA-eligible vs CAS-fallback claim_batch decisions
# in the MPMC consumer hot path. Used to evaluate whether a hybrid
# CAS/FAA path would fire on a given workload before committing to the
# implementation. Not for production use.
mpmc-instrument = []
# Enables `dhat` heap profiling in examples that opt in (currently
# `mpmc_vs_nspmc_dhat`). Run with:
#   cargo run --release --example mpmc_vs_nspmc_dhat --features dhat-heap
# Output is `dhat-heap.json`, loadable in https://nnethercote.github.io/dh_view/dh_view.html
# Note: `dhat` is declared under `[dependencies]` rather than
# `[dev-dependencies]` because Cargo disallows optional
# dev-dependencies, but it's only pulled in when this feature is
# enabled — production builds are unaffected.
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[[bench]]
name = "mpsc"
harness = false

[[bench]]
name = "spsc"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "fanin"
harness = false

[[bench]]
name = "spmc"
harness = false

[[bench]]
name = "mpmc"
harness = false
