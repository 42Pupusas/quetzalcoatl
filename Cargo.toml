[package]
name = "quetzalcoatl"
version = "0.14.0"
edition = "2021"
authors = ["quetzalcoatl contributors"]
description = "Lock-free ring buffers (SPSC, MPSC, SPMC, MPMC, and broadcast) for high-performance concurrent communication"
license = "MIT"
repository = "https://github.com/42Pupusas/quetzalcoatl"
keywords = ["lock-free", "mpmc", "spmc", "ring-buffer", "broadcast"]
categories = ["concurrency", "data-structures"]
readme = "README.md"
# Allowlist — keeps benches/ and examples/ out of the published crate
# (they reference dev-dependencies and bloat the download).
#
# Every source directory is matched by glob. Listing `src/common`
# file-by-file is what shipped 0.14.0 broken: nine modules declared in
# `common/mod.rs` were missing from the tarball, so the published crate
# did not compile at all. The list was kept manual to hold back
# `loom_models.rs`; that file is `#[cfg(all(test, loom, ...))]`, so
# shipping it costs a few KB and compiles for nobody — a far better
# trade than a list that silently drifts every time a module is added.
#
# `cargo package` is the check that catches this: it builds the tarball
# it produces. Run it before publishing.
include = [
    "src/*.rs",
    "src/broadcast/**/*.rs",
    "src/common/**/*.rs",
    "src/mpmc/**/*.rs",
    "src/mpsc/**/*.rs",
    "src/spmc/**/*.rs",
    "src/spsc/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[features]
# Enables `dhat` heap profiling in examples that opt in (currently
# `mpmc_vs_nspmc_dhat`). Run with:
#   cargo run --release --example mpmc_vs_nspmc_dhat --features dhat-heap
# Output is `dhat-heap.json`, loadable in https://nnethercote.github.io/dh_view/dh_view.html
# Note: `dhat` is declared under `[dependencies]` rather than
# `[dev-dependencies]` because Cargo disallows optional
# dev-dependencies, but it's only pulled in when this feature is
# enabled — production builds are unaffected.
async = []
dhat-heap = ["dep:dhat"]

[lints.rust]
# `loom` is a compiler cfg cargo sets from the [target.'cfg(loom)']
# dependency below, not a feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
dhat = { version = "0.3", optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
divan = "0.1"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[[bench]]
name = "mpsc"
harness = false

[[bench]]
name = "spsc"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "fanin"
harness = false

[[bench]]
name = "spmc"
harness = false

[[bench]]
name = "mpmc"
harness = false

[[bench]]
name = "matched"
harness = false

[dev-dependencies]
anyhow = "1.0.102"
io-uring = "0.7.12"
libc = "0.2.186"
