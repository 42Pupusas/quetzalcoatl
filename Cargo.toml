[package]
name = "quetzalcoatl"
version = "0.14.0"
edition = "2021"
authors = ["quetzalcoatl contributors"]
description = "Lock-free ring buffers (SPSC, MPSC, SPMC, MPMC, and broadcast) for high-performance concurrent communication"
license = "MIT"
repository = "https://github.com/42Pupusas/quetzalcoatl"
keywords = ["lock-free", "mpmc", "spmc", "ring-buffer", "broadcast"]
categories = ["concurrency", "data-structures"]
readme = "README.md"
# Tight allowlist — keeps benches/ and examples/ out of the published
# crate (they reference dev-dependencies and bloat the download).
# `include` wins over `exclude` outright, so the loom models are kept
# out by naming the directories rather than by excluding the file:
# it is test-only scaffolding naming a crate the package never depends
# on.
include = [
    "src/*.rs",
    "src/broadcast/**/*.rs",
    "src/common/atomics.rs",
    "src/common/mod.rs",
    "src/common/park.rs",
    "src/common/park_probe.rs",
    "src/common/park_registration.rs",
    "src/common/park_registry.rs",
    "src/common/thread_parker.rs",
    "src/common/wake_async.rs",
    "src/common/waker_overflow.rs",
    "src/mpmc/**/*.rs",
    "src/mpsc/**/*.rs",
    "src/spmc/**/*.rs",
    "src/spsc/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[features]
# Enables `dhat` heap profiling in examples that opt in (currently
# `mpmc_vs_nspmc_dhat`). Run with:
#   cargo run --release --example mpmc_vs_nspmc_dhat --features dhat-heap
# Output is `dhat-heap.json`, loadable in https://nnethercote.github.io/dh_view/dh_view.html
# Note: `dhat` is declared under `[dependencies]` rather than
# `[dev-dependencies]` because Cargo disallows optional
# dev-dependencies, but it's only pulled in when this feature is
# enabled — production builds are unaffected.
async = []
dhat-heap = ["dep:dhat"]

[lints.rust]
# `loom` is a compiler cfg cargo sets from the [target.'cfg(loom)']
# dependency below, not a feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
dhat = { version = "0.3", optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
divan = "0.1"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[[bench]]
name = "mpsc"
harness = false

[[bench]]
name = "spsc"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "fanin"
harness = false

[[bench]]
name = "spmc"
harness = false

[[bench]]
name = "mpmc"
harness = false

[[bench]]
name = "matched"
harness = false

[dev-dependencies]
anyhow = "1.0.102"
io-uring = "0.7.12"
libc = "0.2.186"
